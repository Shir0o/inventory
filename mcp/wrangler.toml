name = "lit-ledger-mcp"
main = "worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Create once, from mcp/: npx wrangler kv namespace create OAUTH_KV
# then paste the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "94db921f88c0445fa981f2a6acb6d344"

[vars]
FIREBASE_PROJECT_ID = "inventory-website-ca94e"
FIREBASE_DATABASE_ID = "ai-studio-7dcfaee1-ad85-4940-b13d-8df8f061af40"
MCP_MEMBER_ID = "lit-ledger-team"

# Secrets (never in this file):
#   npx wrangler secret put FIREBASE_SERVICE_ACCOUNT   # the service-account JSON, one line
#   npx wrangler secret put MCP_ACCESS_PASSWORD        # the consent-screen password
#   npx wrangler secret put MCP_AUTH_TOKEN             # optional static Bearer token for CLI/IDE clients
#
# For local `wrangler dev`, put the same two values in mcp/.dev.vars.

[observability]
enabled = true
