<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246a9b" />
      <stop offset="100%" stop-color="#17496c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b2233" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background base rounded container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Layers Icon Graphic -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Layer -->
    <polygon points="256 128 396 200 256 272 116 200" fill="rgba(255,255,255,0.18)" stroke="#ffffff" />
    <!-- Middle Layer -->
    <polyline points="116 264 256 336 396 264" />
    <!-- Bottom Layer -->
    <polyline points="116 328 256 400 396 328" />
  </g>
</svg>
